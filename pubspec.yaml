    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  crypto: ^3.0.5
  http: ^1.2.1
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.0
  printing: ^5.13.1
  path_provider: ^2.1.4
